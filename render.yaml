# Render Blueprint: the API, on the free plan.
# Dashboard → New → Blueprint → pick this repo. Render asks for the `sync: false` values.
# Data lives in Turso (hosted SQLite, free tier), because free Render instances
# have no persistent disk: anything written to local files is lost on restart.
services:
  - type: web
    name: promptvault-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      # From `turso db show <name> --url`, e.g. libsql://promptvault-you.aws-ap-south-1.turso.io
      - key: TURSO_DATABASE_URL
        sync: false
      # From `turso db tokens create <name>`
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Your email(s), comma-separated: these accounts get the Admin tab.
      - key: ADMIN_EMAILS
        sync: false
      # The Vercel site, e.g. https://promptvault.vercel.app (comma-separate several).
      - key: ALLOWED_ORIGINS
        sync: false
