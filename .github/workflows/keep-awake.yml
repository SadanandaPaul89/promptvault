# Render's free plan puts the API to sleep after 15 minutes without traffic, and
# waking it takes about a minute. This pings the health check every 10 minutes
# so visitors don't hit that delay. One always-on free service fits inside
# Render's 750 free hours a month. Delete this file to let it sleep.
# Set the repo variable RENDER_URL (Settings → Secrets and variables → Actions → Variables)
# if Render gave the service a different address.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        env:
          RENDER_URL: ${{ vars.RENDER_URL || 'https://promptvault-api.onrender.com' }}
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$RENDER_URL/api/health"
